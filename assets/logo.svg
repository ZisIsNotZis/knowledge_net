<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="knowledge_net: a memory bank read by attention">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbbf24" stop-opacity=".95"/>
      <stop offset="1" stop-color="#f59e0b" stop-opacity=".35"/>
    </linearGradient>
  </defs>

  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#bg)"/>
  <rect x="4.75" y="4.75" width="118.5" height="118.5" rx="27.25" fill="none" stroke="#2dd4bf" stroke-opacity=".24" stroke-width="1.5"/>

  <!-- read head -->
  <circle cx="64" cy="30" r="5.5" fill="#fbbf24"/>
  <circle cx="64" cy="30" r="9" fill="none" stroke="#fbbf24" stroke-opacity=".28" stroke-width="1.5"/>

  <!-- attention beams -->
  <path d="M64 39 L47 51" stroke="url(#beam)" stroke-width="2.4" stroke-linecap="round"/>
  <path d="M64 39 L81 51" stroke="#2dd4bf" stroke-opacity=".28" stroke-width="1.6" stroke-linecap="round"/>
  <path d="M64 39 L47 77" stroke="#2dd4bf" stroke-opacity=".18" stroke-width="1.4" stroke-linecap="round"/>
  <path d="M64 39 L81 77" stroke="#2dd4bf" stroke-opacity=".12" stroke-width="1.4" stroke-linecap="round"/>

  <!-- memory bank -->
  <rect x="26" y="49" width="76" height="47" rx="12" fill="#0b1220" stroke="#2dd4bf" stroke-opacity=".5" stroke-width="2"/>
  <rect x="36" y="59" width="24" height="12" rx="6" fill="#fbbf24"/>
  <rect x="68" y="59" width="24" height="12" rx="6" fill="#2dd4bf" fill-opacity=".38"/>
  <rect x="36" y="76" width="24" height="12" rx="6" fill="#2dd4bf" fill-opacity=".22"/>
  <rect x="68" y="76" width="24" height="12" rx="6" fill="#2dd4bf" fill-opacity=".16"/>
</svg>
